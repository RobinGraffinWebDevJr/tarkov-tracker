# Compile l'exe Windows à chaque tag vX.Y.Z et le publie dans les Releases, avec son empreinte
# SHA-256. « Run workflow » (onglet Actions) fait la même compilation sans publier : l'exe est
# alors téléchargeable dans les artefacts du run.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Version = tag (la mise à jour intégrée compare ces versions)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - name: Vérification des types
        run: npm run typecheck
      - name: Compilation
        run: npm run build:win
      - name: Empreinte
        shell: bash
        run: |
          cd dist
          sha256sum tarkov-tracker-windows-x64.exe > tarkov-tracker-windows-x64.exe.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: tarkov-tracker-windows-x64
          path: |
            dist/tarkov-tracker-windows-x64.exe
            dist/tarkov-tracker-windows-x64.exe.sha256
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            dist/tarkov-tracker-windows-x64.exe
            dist/tarkov-tracker-windows-x64.exe.sha256
          generate_release_notes: true
